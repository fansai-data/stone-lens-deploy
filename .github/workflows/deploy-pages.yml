name: Deploy static StoneLens demo to GitHub Pages

on:
  push:
    branches: [github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 优化：静态展示分支保留浏览器端匹配，不构建需要服务器密钥的 AI 路由。
      NEXT_OUTPUT: export
      NEXT_PUBLIC_BASE_PATH: /stone-lens-deploy
      NEXT_PUBLIC_STATIC_DEMO: "true"
      NEXT_PUBLIC_SITE_URL: https://justice060407.github.io/stone-lens-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # 优化：首次运行时自动为仓库启用 GitHub Pages，避免 Pages 尚未创建导致 404。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
